<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Błąd systemu | Pecunia</title>
    <link rel="stylesheet" th:href="@{/css/style_error.css}">
    <link rel="icon" type="image/png" href="/images/pecunia-logo.png"/>
</head>

<body>

<div class="error-card">

    <div class="logo">
        <img th:src="@{/images/logo.jpg}" alt="Pecunia Logo">
    </div>

    <h1>💥 Ups! Coś poszło nie tak...</h1>

    <h2 th:if="${status}" th:text="'Kod błędu: ' + ${status}"></h2>

    <!-- 🔥 KLUCZOWE -->
    <p th:if="${message}" th:text="${message}"></p>
    <p th:unless="${message}">
        Wystąpił nieoczekiwany błąd w systemie.<br>
        Spróbuj ponownie później.
    </p>

    <a href="/" class="button">🏠 Wróć na stronę główną</a>

    <!-- 🔥 backend generuje -->
    <div class="code" th:if="${errorId}">
        Error ID: <span th:text="${errorId}"></span>
    </div>

</div>

<footer>
    Pecunia © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span>
</footer>

</body>
</html>
